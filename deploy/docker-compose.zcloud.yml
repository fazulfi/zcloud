# zcloud production docker compose (fork build)

# Production: zrouter.dev / api.zrouter.dev / app.zrouter.dev (TLS at Cloudflare, origin nginx)
# Access:        https://app.zrouter.dev (SPA) / https://api.zrouter.dev (API)

# Stack: zrouter (stateless, built from fork, NOT weishaw/sub2api:latest)
#        postgres   — pinned, named volume, private docker network (compose-managed)
#        redis      — pinned, password, private docker network (compose-managed)
#        caddy/nginx— TLS reverse proxy, SSE buffering off (host nginx; Cloudflare TLS)

# Usage:
#   cp deploy/.env.zcloud.example deploy/.env.zcloud && chmod 600 deploy/.env.zcloud
#   docker compose -f deploy/docker-compose.zcloud.yml --env-file deploy/.env.zcloud build
#   docker compose -f deploy/docker-compose.zcloud.yml --env-file deploy/.env.zcloud up -d

name: zcloud

services:
  zrouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${ZCLOUD_VERSION:-0.1.183-zcloud}
    image: zcloud/zrouter:${ZCLOUD_VERSION:-0.1.183-zcloud}
    container_name: zcloud-zrouter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      # Container listens on SERVER_PORT (env_file), default 18080 — map 1:1
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-18080}:${SERVER_PORT:-18080}"
    env_file:
      - .env.zcloud
    volumes:
      - zcloud_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:${SERVER_PORT:-18080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Compose-managed PG/Redis on private network; DATABASE_HOST/REDIS_HOST may point at external instances
  # at managed instances; keep these services on the private network.
  postgres:
    image: postgres:18-alpine
    container_name: zcloud-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-zcloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zcloud} -d ${POSTGRES_DB:-zcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: zcloud-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zcloud_data:
  postgres_data:
  redis_data:

networks:
  default:
    name: zcloud-net
