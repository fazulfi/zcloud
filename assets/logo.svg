<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">zcloud</title>
  <desc id="desc">A stylized Z and cloud mark for zcloud — subscription routing into APIs.</desc>
  <defs>
    <linearGradient id="zc-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142B56"/>
      <stop offset=".52" stop-color="#0A1A39"/>
      <stop offset="1" stop-color="#061127"/>
    </linearGradient>
    <radialGradient id="zc-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 92) rotate(51) scale(342 382)">
      <stop stop-color="#3E68B0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3E68B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zc-brand" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F4BD"/>
      <stop offset=".48" stop-color="#39D9E7"/>
      <stop offset="1" stop-color="#3875F6"/>
    </linearGradient>
    <filter id="zc-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".55" stdDeviation=".65" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#zc-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#zc-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#A5BFFF" stroke-opacity=".16" stroke-width="1.5"/>

  <!-- Stylized Z -->
  <g transform="translate(96 84)" fill="none" stroke="url(#zc-brand)" stroke-linecap="round" stroke-linejoin="round" stroke-width="34" filter="url(#zc-shadow)">
    <path d="M 64 24 L 256 24 L 64 216 L 256 216"/>
  </g>

  <!-- Cloud above-right (accent) -->
  <g transform="translate(300 120)" fill="url(#zc-brand)" opacity=".92">
    <path d="M 96 72 a 28 28 0 0 1 0 -56 a 34 34 0 0 1 64 -8 a 30 30 0 0 1 26 16 a 30 30 0 0 1 -8 48 z"/>
  </g>
</svg>
